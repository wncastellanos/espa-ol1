<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repaso Unidad 0 · Español I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#eef2f8; --surface:#ffffff; --sunk:#f5f7fb; --ink:#152036; --muted:#566179; --line:#d6ddea;
  --accent:#1d4ea0; --accent-ink:#ffffff; --accent-soft:#e3ebfa;
  --sun:#f3a712; --sun-soft:#fff3d6; --sun-ink:#7a4a00;
  --ok:#17744a; --ok-bg:#e2f5ea; --bad:#b3261e; --bad-bg:#fde8e6; --rev:#8a5a00; --rev-bg:#fff1d0;
  --c1:#1d4ea0; --c2:#b3261e; --c3:#17744a; --c4:#7a4a00;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#172034; --sunk:#121a2b; --ink:#e7ecf5; --muted:#9ca7bd; --line:#2a3550;
  --accent:#86a9ff; --accent-ink:#0e1320; --accent-soft:#1e2b4a;
  --sun:#f6b93b; --sun-soft:#3a2c0e; --sun-ink:#ffd88a;
  --ok:#62d29b; --ok-bg:#12301f; --bad:#ff8d84; --bad-bg:#3b1815; --rev:#ffcf70; --rev-bg:#382a0c;
  --c1:#86a9ff; --c2:#ff8d84; --c3:#62d29b; --c4:#ffcf70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#172034; --sunk:#121a2b; --ink:#e7ecf5; --muted:#9ca7bd; --line:#2a3550;
  --accent:#86a9ff; --accent-ink:#0e1320; --accent-soft:#1e2b4a;
  --sun:#f6b93b; --sun-soft:#3a2c0e; --sun-ink:#ffd88a;
  --ok:#62d29b; --ok-bg:#12301f; --bad:#ff8d84; --bad-bg:#3b1815; --rev:#ffcf70; --rev-bg:#382a0c;
  --c1:#86a9ff; --c2:#ff8d84; --c3:#62d29b; --c4:#ffcf70; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.gut{padding-left:16px;padding-right:16px}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:4px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.brand-k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand-t{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.pill{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
nav.tabs{max-width:900px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:700;padding:8px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-top:22px;padding-bottom:80px}
.page{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:clamp(24px,4vw,32px)}
h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
p{margin:0}
.lead{font-size:18px;color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.note{background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;padding:12px 16px}
.rule{background:var(--accent-soft);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.rule strong{color:var(--accent)}
.warn{background:var(--bad-bg);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.warn strong{color:var(--bad)}
.es{font-style:italic}
.sub{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
ul.clean,ol.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.btn{font:inherit;font-weight:700;text-decoration:none;display:inline-block;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus,textarea:focus,select:focus,a:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs a,.chip{font:inherit;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.subtabs a.on,.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:border-color .15s}
.big:hover{border-color:var(--accent)}
.big .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.big p{color:var(--muted);font-size:15px}
.big .pts{font-size:13px;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:middle}
th{background:var(--sunk);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
td.subj{font-weight:700;white-space:nowrap}
tr.extra td{color:var(--muted)}
.end{background:var(--sun-soft);color:var(--sun-ink);font-weight:700;border-radius:4px;padding:0 2px}
.say{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;padding:0}
.say svg{width:17px;height:17px}
.no-tts .say,.no-tts .playbig{display:none}
.cell{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.voc{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:10px;padding:8px 12px;min-width:0}
.voc .w{font-weight:700}
.voc .en{font-size:14px;color:var(--muted)}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.blk{border-radius:10px;padding:8px 14px;border:2px solid;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.blk small{font-weight:400;font-size:12px;opacity:.85}
.blk.b1{border-color:var(--c1);color:var(--c1)}
.blk.b2{border-color:var(--c2);color:var(--c2);background:var(--bad-bg)}
.blk.b3{border-color:var(--c4);color:var(--c4)}
.blk.b4{border-color:var(--c3);color:var(--c3)}
.plus{color:var(--muted);font-weight:700}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.usos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.steps4{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.steps4 li{counter-increment:s;background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.steps4 li::before{content:"Paso " counter(s);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.machine{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.machine label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
select.in{font:inherit;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:8px;padding:6px 8px}
.mout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mout div{border:1px dashed var(--line);border-radius:10px;padding:10px}
.mout .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mout .v{font-family:var(--display);font-weight:600;font-size:20px}
.mout .final{border-style:solid;border-color:var(--sun);background:var(--sun-soft)}
.mout .final .v{color:var(--sun-ink);font-size:24px}

/* flashcards */
.fc{perspective:1200px;cursor:pointer;outline:none;height:260px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.face .tag{position:absolute;top:12px;left:16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.face .txt{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1.15}
.face .txt.long{font-size:clamp(20px,3.4vw,26px);font-weight:600}
.fc:focus-visible .face{outline:3px solid var(--sun)}
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.fc-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.no{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn.yes{border-color:var(--ok);background:var(--ok);color:var(--surface)}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{font:inherit;text-align:left;background:var(--sunk);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:50px}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.mt.nope{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* practice items */
.rstats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rstats b{color:var(--ink);font-variant-numeric:tabular-nums}
.ritem{display:flex;flex-direction:column;gap:12px}
.ilabel{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.iq{font-size:20px;line-height:2.1}
.iq .paren{font-size:16px;color:var(--muted)}
.iq .small{font-size:16px;line-height:1.5}
.iq p{line-height:1.5}
input.blank{font:inherit;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:8px;padding:2px 8px;max-width:100%;min-width:6ch}
input.blank.wide{width:100%;display:block;margin-top:6px;font-size:18px;padding:6px 10px}
input.blank.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
input.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
input.blank.rev{border-color:var(--rev);background:var(--rev-bg);color:var(--rev)}
.opts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.opt{font:inherit;background:var(--sunk);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.opt[disabled]{cursor:default}
.line{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.line .ph{color:var(--muted);font-size:15px;padding-left:4px}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.tile{font:inherit;font-size:18px;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-bottom-width:4px;border-radius:10px;padding:4px 12px;cursor:pointer}
.line .tile{background:var(--accent-soft)}
.fb{font-size:16px}
.fb.good{color:var(--ok);font-weight:700}
.fb.try{color:var(--bad)}
.fb ul{margin:4px 0 0;padding-left:1.2em;font-weight:400;color:var(--ink)}
.fb .acc{color:var(--rev);font-weight:400}
.iexp{background:var(--sunk);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.exrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.playbig{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);padding:8px 18px;cursor:pointer;line-height:1.3}
.playbig svg{width:20px;height:20px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.back{align-self:flex-start}
.tog{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent)}

/* reading */
.passage{background:var(--sunk);border-radius:12px;padding:16px 18px;font-size:18px;line-height:1.8}
.passage .s{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .2s}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);outline:2px solid var(--accent)}
.passage .s.ev{background:var(--sun-soft);color:var(--sun-ink);box-shadow:inset 0 -2px 0 var(--sun)}
.qcard{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.qcard:first-child{border-top:0;padding-top:0}
.qcard .iq{font-size:17px;line-height:1.5;font-weight:700}

/* writing */
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;background:var(--sunk);border-radius:10px;padding:12px 16px}
.facts dt{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;align-self:center}
.facts dd{margin:0;font-weight:700}
textarea{font:inherit;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:8px;padding:10px;width:100%;min-height:170px;resize:vertical;line-height:1.6}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px}
.checks li{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.checks .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.checks li.yes{color:var(--ok)}
.checks li.yes .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.model{background:var(--ok-bg);color:var(--ink);border-radius:10px;padding:12px 16px}

/* exam */
.ebar{display:flex;align-items:center;gap:12px}
.ebar .prog{flex:1}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--accent)}
.miss{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.miss li{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:15px}
.miss .ans{color:var(--ok);font-weight:700}
.fcast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fday{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.3;min-width:0}
.fday .ic{font-size:30px;line-height:1.2}
.fday .sub{font-size:12px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.abcl{font:inherit;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.abcl b{font-family:var(--display);font-size:22px}
.abcl span{font-size:14px;color:var(--muted)}
.abcl:hover{border-color:var(--accent)}
.unithead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
kbd{font-family:inherit;font-size:14px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--sunk)}
@media (max-width:560px){.fcast{gap:3px}.fday{font-size:11px;padding:6px 2px}.fday .ic{font-size:22px}.fday b{overflow-wrap:anywhere}.card{padding:16px}body{font-size:16px}.iq{font-size:18px}.match{gap:6px}.mt{font-size:15px;padding:8px}}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}.mt.nope{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in gut">
    <div class="brand"><span class="brand-k">Español I</span><span class="brand-t">Repaso · Unidad 0</span></div>
    <button id="speed" class="pill" type="button" aria-label="Velocidad del audio">Audio: normal</button>
  </div>
  <nav class="tabs gut" id="tabs" aria-label="Secciones">
    <a href="#inicio" data-r="inicio">Inicio</a>
    <a href="#repasar" data-r="repasar">Repasar</a>
    <a href="#practicar" data-r="practicar">Practicar</a>
    <a href="#examen" data-r="examen">Examen de práctica</a>
  </nav>
</header>
<main class="gut" id="main"></main>

<script>
(function(){
"use strict";
/* ================= utilities ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[].slice.call((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const stripAcc=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"");
const norm=s=>String(s||"").toLowerCase().replace(/[¿?¡!.,;:"“”«»'’()]/g," ").replace(/\s+/g," ").trim();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
const plain=h=>String(h).replace(/\{_+\}/g,"____").replace(/<br>|<\/p>/g," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
function pickW(pairs){let t=0;pairs.forEach(p=>t+=p[0]);let r=Math.random()*t;for(const p of pairs){if((r-=p[0])<0)return p[1];}return pairs[pairs.length-1][1];}

/* ================= audio ================= */
const SET={vos:false,rate:0.9};
const hasTTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
if(!hasTTS)document.documentElement.classList.add("no-tts");
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];voice=vs.find(x=>/^es[-_](MX|US)/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang))||null;}catch(e){}}
if(hasTTS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function speak(t,onend){
  if(!hasTTS){if(onend)onend();return;}

/* ================= router ================= */
const main=$("#main");let cleanup=null;let UNIT="u0";
function fixPath(p){p=p||"inicio";if(/^(repasar|practicar|examen)(\/|$)/.test(p))p=UNIT+"/"+p;return p;}
function curHash(){let h="";try{h=location.hash.slice(1);}catch(e){}return fixPath(h);}
function go(path){path=fixPath(path);try{if(location.hash.slice(1)!==path)history.pushState(null,"","#"+path);}catch(e){}route(path);}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute("href").slice(1));});
window.addEventListener("popstate",()=>route(curHash()));
function route(path){
  if(typeof path!=="string")path=curHash();
  const P=path.split("/"),area=P[0]==="u0"?(P[1]||""):"";
  hush();if(cleanup){cleanup();cleanup=null;}
  const top=area||"inicio";
  $$("#tabs a").forEach(a=>{const on=a.dataset.r===top;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  pUnit(area,P[2]||"");
  window.scrollTo(0,0);
}

   <div class="rule"><strong>2 · Posesión</strong><span>tener + a thing</span><span class="es">Nosotros tenemos un cuaderno. ${say("Nosotros tenemos un cuaderno.")}</span></div>
   <div class="rule"><strong>3 · Expresiones</strong><span>tener + hambre, sed, frío…</span><span class="es">Yo tengo hambre. ${say("Yo tengo hambre.")}</span></div>
   <div class="rule"><strong>4 · Obligación</strong><span>tener + que + infinitive</span><span class="es">Tengo que estudiar. ${say("Tengo que estudiar.")}</span></div></div>
  <div class="vocab">${EXPR.map(x=>`<div class="voc"><div><div class="w">tener ${x[0]}</div><div class="en">to be ${x[1]}</div></div>${say("tener "+x[0])}</div>`).join("")}</div></article>

  <article class="card" id="g-tq"><h3>5 · Tener que + infinitivo (to have to)</h3>
  <div class="formula"><span class="blk b1">Pronombre<small>yo, tú, él…</small></span><span class="plus">+</span><span class="blk b2">TENER<small>conjugate it!</small></span><span class="plus">+</span><span class="blk b3">que<small>= “to”</small></span><span class="plus">+</span><span class="blk b4">infinitivo<small>ends in -r</small></span></div>
  <ul class="clean" style="font-size:18px">
   <li><span class="es">Yo <b>tengo</b> que estudiar.</span> ${say("Yo tengo que estudiar.")}</li>
   <li><span class="es">Él <b>tiene</b> que practicar.</span> ${say("Él tiene que practicar.")}</li>
   <li><span class="es">Nosotros <b>tenemos</b> que leer.</span> ${say("Nosotros tenemos que leer.")}</li></ul>
  <div class="note"><b>Remember!</b><ul class="clean" style="margin-top:6px">
   <li><b>Que</b> means “to” <b>only</b> in this sentence form (have <b>to</b>).</li>
   <li><b>All infinitives end with an r:</b> estudia<b>r</b>, lee<b>r</b>, escribi<b>r</b>.</li>
   <li><b>The only thing we conjugate is TENER</b>, depending on the pronoun. The second verb never changes.</li></ul></div>
  <div class="warn"><strong>Common mistake</strong><p>✗ <span class="es">Ella tiene que escribe.</span> → ✓ <span class="es">Ella tiene que escribir.</span></p><p>Negative: put <b>no</b> before tener. <span class="es">Yo no tengo que comer ahora.</span> ${say("Yo no tengo que comer ahora.")}</p></div></article>

  <article class="card" id="g-preg"><h3>6 · Preguntas y respuestas</h3>
  <p>The verb changes with the person. A question to <b>tú</b> gets a <b>yo</b> answer. When you report about someone else, use <b>él / ella</b>.</p>
  <div class="tbl-wrap"><table><thead><tr><th>You ask (tú)</th><th>She answers (yo)</th><th>You report (ella)</th></tr></thead><tbody>
  ${[["¿Cómo te llamas?","Me llamo Ana.","Se llama Ana."],["¿De dónde eres?","Soy de Texas.","Es de Texas."],["¿Cuántos años tienes?","Tengo catorce años.","Tiene catorce años."],["¿Dónde vives?","Vivo en Houston.","Vive en Houston."],["¿Qué lees en casa?","Leo libros.","Lee libros."],["¿Qué escribes en clase?","Escribo mensajes.","Escribe mensajes."],["¿Qué tienes que hacer hoy?","Tengo que estudiar.","Tiene que estudiar."]].map(r=>`<tr>${r.map(c=>`<td><span class="cell"><span class="es">${c}</span>${say(c)}</span></td>`).join("")}</tr>`).join("")}
  </tbody></table></div>
  <p class="sub">Question words: <b>¿Cómo?</b> how · <b>¿De dónde?</b> from where · <b>¿Dónde?</b> where · <b>¿Cuántos?</b> how many · <b>¿Qué?</b> what</p></article>

  <article class="card" id="g-neg"><h3>7 · La negación</h3>
  <p>Put <b>no</b> right before the conjugated verb.</p>
  <ul class="clean"><li><span class="es">No tengo hambre.</span> I'm not hungry.</li><li><span class="es">Ella no lee libros.</span> She doesn't read books.</li><li><span class="es">No tenemos que estudiar hoy.</span> We don't have to study today.</li><li>Answering a question: <span class="es">No, no leo libros.</span> (two no's!)</li></ul></article>

  <article class="card" id="g-escr"><h3>8 · Escribir sobre otra persona</h3>

  <p><a href="#practicar/f">Practice writing →</a></p></article>`;

function deckChips(cur){const DECKS=CURD();return `<div class="subtabs" role="group" aria-label="Elige un tema">${Object.keys(DECKS).map(k=>`<button type="button" class="chip${k===cur?" on":""}" data-deck="${k}">${DECKS[k].name}</button>`).join("")}</div>`;}
function pTarjetas(box){
  const DECKS=CURD();const st={deck:Object.keys(DECKS)[0],order:[],i:0,known:0,again:[],flip:false,en:false};
  function start(list){st.order=shuffle(list);st.i=0;st.known=0;st.again=[];st.flip=false;draw();}
  function cards(){return DECKS[st.deck].cards;}
  function draw(){
    const D=DECKS[st.deck],total=st.order.length;
    let h=deckChips(st.deck)+`<div class="card">`;
    if(st.i>=total){
      h+=`<h3>¡Terminaste!</h3><p style="font-size:20px">You knew <b>${st.known}</b> of <b>${total}</b>.</p><div class="row">${st.again.length?`<button class="btn" type="button" id="again">Review the ${st.again.length} I missed</button>`:""}<button class="btn ghost" type="button" id="restart">Start over</button></div>`;
    }else{
      const c=st.order[st.i],f=st.en?c[1]:c[0],b=st.en?c[0]:c[1];
      h+=`<div class="fc-bar"><span class="sub">Tarjeta ${st.i+1} de ${total} · Sé: ${st.known} · Repasar: ${st.again.length}</span><label class="tog"><input type="checkbox" id="enf"${st.en?" checked":""}> Show the back side first</label></div>
      <div class="prog"><i style="width:${st.i/total*100}%"></i></div>
      <div class="fc${st.flip?" flip":""}" tabindex="0" role="button" aria-label="Tarjeta. Press to flip."><div class="fc-in">
        <div class="face front"><span class="tag">${st.en?D.back:D.front}</span><div class="txt${f.length>22?" long":""}">${esc(f)}</div></div>
        <div class="face back"><span class="tag">${st.en?D.front:D.back}</span><div class="txt${b.length>22?" long":""}">${esc(b)}</div>${say(c[2])}</div></div></div>
      <div class="fc-actions"><button class="btn no" type="button" id="no">↻ Otra vez</button><button class="btn ghost" type="button" id="flip">Voltear</button><button class="btn yes" type="button" id="yes">✓ Lo sé</button></div>
      <p class="sub" style="text-align:center">Click the card or press <kbd>Space</kbd> to flip. <kbd>←</kbd> otra vez · <kbd>→</kbd> lo sé</p>`;
    }
    box.innerHTML=h+`</div>`;
    $$("[data-deck]",box).forEach(b=>b.onclick=()=>{st.deck=b.dataset.deck;start(cards());});
    if(st.i>=total){const a=$("#again",box);if(a)a.onclick=()=>start(st.again);$("#restart",box).onclick=()=>start(cards());return;}
    const fc=$(".fc",box);
    const flip=()=>{st.flip=!st.flip;fc.classList.toggle("flip",st.flip);if(st.flip&&!st.en)speak(st.order[st.i][2]);};
    fc.onclick=e=>{if(e.target.closest(".say"))return;flip();};
    $("#flip",box).onclick=flip;
    $("#yes",box).onclick=()=>{st.known++;st.i++;st.flip=false;draw();};
    $("#no",box).onclick=()=>{st.again.push(st.order[st.i]);st.i++;st.flip=false;draw();};
    $("#enf",box).onchange=e=>{st.en=e.target.checked;st.flip=false;draw();};
  }
  function key(e){
    if(e.target.matches("input,textarea,select")||st.i>=st.order.length)return;
    if(e.key===" "||e.key==="Enter"){if(e.target.closest("button:not(.fc)"))return;e.preventDefault();const b=$("#flip",box);if(b)b.click();}
    else if(e.key==="ArrowRight"){const b=$("#yes",box);if(b)b.click();}
    else if(e.key==="ArrowLeft"){const b=$("#no",box);if(b)b.click();}
  }
  document.addEventListener("keydown",key);cleanup=()=>document.removeEventListener("keydown",key);
  start(cards());
}

function pEmparejar(box){
  const DECKS=CURD();let deck=Object.keys(DECKS)[Object.keys(DECKS).length>4?4:0];
  function game(){
    const pick=shuffle(DECKS[deck].cards).slice(0,6).map((c,i)=>({id:i,c}));
    const L=shuffle(pick),R=shuffle(pick);let sel=null,found=0,miss=0;const t0=Date.now();
    box.innerHTML=deckChips(deck)+`<div class="card"><div class="fc-bar"><h3>Match the pairs</h3><span class="sub" id="mstat">Errores: 0</span></div>
      <p class="sub">Click a word on the left, then its match on the right.</p>
      <div class="match"><div class="col">${L.map(p=>`<button class="mt" type="button" data-side="L" data-id="${p.id}">${esc(p.c[0])}</button>`).join("")}</div>
      <div class="col">${R.map(p=>`<button class="mt" type="button" data-side="R" data-id="${p.id}">${esc(p.c[1])}</button>`).join("")}</div></div>
      <div id="mdone"></div></div>`;
    $$("[data-deck]",box).forEach(b=>b.onclick=()=>{deck=b.dataset.deck;game();});
    $$(".mt",box).forEach(b=>b.onclick=()=>{
      if(b.classList.contains("done"))return;
      if(!sel||sel.dataset.side===b.dataset.side){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return;}
      if(sel.dataset.id===b.dataset.id){[sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true;});
        speak(pick.find(p=>String(p.id)===b.dataset.id).c[2]);found++;sel=null;
        if(found===pick.length){const s=Math.round((Date.now()-t0)/1000);$("#mdone",box).innerHTML=`<div class="note" style="margin-top:10px"><b>¡Excelente!</b> All ${pick.length} pairs in ${s} seconds with ${miss} ${miss===1?"mistake":"mistakes"}. <button class="btn" type="button" id="mre" style="margin-left:8px">Play again</button></div>`;$("#mre",box).onclick=game;}}
      else{miss++;$("#mstat",box).textContent="Errores: "+miss;const a=sel;[a,b].forEach(x=>x.classList.add("nope"));setTimeout(()=>[a,b].forEach(x=>x.classList.remove("nope","sel")),450);sel=null;}
    });
  }
  game();
}

function pExamen(box){
  const U=UNITS[UNIT];
  box.innerHTML=`<div><h2>Examen de práctica</h2><p class="lead" style="margin-top:6px">20 mixed questions from ${U.name}. You get <b>one try</b> for each question. At the end you'll see your score and what to study.</p></div>
  <div class="card"><p>Mixed questions on: ${U.examTopics}.</p>${U.examNote?`<p class="sub">${U.examNote}</p>`:""}
  ${UNIT==="u1"?`<div>${vosToggle()}</div>`:""}<div><button class="btn" type="button" id="go">Start the practice exam</button></div></div>`;
  wireVos(box);
  $("#go",box).onclick=()=>examRun(box,()=>U.exam().map(it=>(it.unit=it.unit||UNIT,it)),()=>pExamen(box));
}
function pMidterm(){
  main.innerHTML=`<section class="page"><div><div class="eyebrow">Unidad 0 + Unidad 1</div><h2>Examen de práctica: midterm</h2><p class="lead" style="margin-top:6px">30 mixed questions from both units. You get <b>one try</b> for each question. At the end you'll see your score by topic and what to study.</p></div>
  <div id="mbox" style="display:flex;flex-direction:column;gap:18px"><div class="card"><p>Mixed questions on: ${UNITS.u0.examTopics}; ${UNITS.u1.examTopics}.</p>
  <p class="sub">Writing is practiced separately in each unit (Unidad 0 → Escribir, Unidad 1 → Expresión escrita).</p>
  <div>${vosToggle()}</div><div><button class="btn" type="button" id="go">Start the midterm practice exam</button></div></div></div></section>`;
  const box=$("#mbox");wireVos(box);
  $("#go").onclick=()=>examRun(box,midtermItems,pMidterm);
}
function midtermItems(){
  const a=[].concat(rep(genSal0,2),rep(genObj0,2),rep(genNum0,3),rep(genCal0,3),rep(genTie0,2),rep(genPai0,2)).map(t=>(t.unit="u0",t));
  const b=[].concat(rep(genA,3),rep(genB,4),rep(genC,3),rep(genD,3)).map(t=>(t.unit="u1",t));
  const r=rnd(READ),q=shuffle(r.q.map((x,k)=>k)).slice(0,2).map(k=>Object.assign(genE(r,k),{unit:"u1"}));
  return shuffle(a.concat(b)).concat(q,[Object.assign(genPro0(),{unit:"u0"})]);
}
function examRun(box,make,again){
  const items=make(),res=[];let k=0;
  box.innerHTML=`<div class="ebar"><span class="sub" id="eno"></span><div class="prog"><i id="ep"></i></div></div><div class="card"><div class="ritem" id="eit"></div><div><button class="btn" type="button" id="enext" hidden>Next →</button></div></div>`;
  const nb=$("#enext",box);
  function show(){
    hush();nb.hidden=true;$("#eno",box).textContent=`Question ${k+1} of ${items.length}`;$("#ep",box).style.width=(k/items.length*100)+"%";
    renderItem($("#eit",box),items[k],1,sc=>{res.push({it:items[k],sc});nb.hidden=false;nb.textContent=k===items.length-1?"See my results →":"Next →";setTimeout(()=>nb.focus({preventScroll:true}),30);});
    window.scrollTo(0,0);
  }
  nb.onclick=()=>{k++;if(k<items.length)show();else results(box,res,again);};
  show();
}
function itemKey(it){
  if(it.kind==="text")return it.key||it.audio||it.blanks.map(b=>b[0]).join(" … ");
  if(it.kind==="mc")return it.options[it.correct];
  if(it.kind==="tiles")return it.answers[0].join(" ");
  return it.model;
}
function secInfo(u,sec){const s=UNITS[u].sections.find(x=>x.id===String(sec).toLowerCase());return s?{id:s.id,name:s.name}:{id:"",name:sec};}
function results(box,res,again){
  const got=res.filter(x=>x.sc===1).length,pct=Math.round(got/res.length*100);
  const multi=uniq(res.map(x=>x.it.unit)).length>1;
  const by={},order=[];res.forEach(x=>{const key=x.it.unit+"|"+x.it.sec;if(!by[key]){by[key]=[0,0];order.push(key);}by[key][1]++;if(x.sc===1)by[key][0]++;});
  order.sort();
  const lab=key=>{const [u,s]=key.split("|");const i=secInfo(u,s);return (multi?UNITS[u].name+" · ":"")+i.name;};
  const link=key=>{const [u,s]=key.split("|");return `#${u}/practicar/${secInfo(u,s).id}`;};
  const weak=order.filter(k=>by[k][0]<by[k][1]).sort((a,b)=>by[a][0]/by[a][1]-by[b][0]/by[b][1]);
  const miss=res.filter(x=>x.sc!==1);
  const strip=it=>it.qtext||plain(it.html.replace(/<div class="(passage|fcast)[\s\S]*?<\/div>(<\/div>)?/g,"").replace(/<p class="small sub"[^>]*>(Vocabulario|Mes)[^<]*<\/p>/g,""));
  box.innerHTML=`<h2>Resultados</h2>
  <div class="card"><div class="row" style="gap:24px"><div class="score">${pct}%</div><div><p style="font-size:20px"><b>${got} of ${res.length}</b> correct</p><p class="sub">${pct>=90?"¡Excelente! You're ready.":pct>=75?"¡Muy bien! Review the ones you missed.":"Keep practicing. Focus on the topics below."}</p></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Tema</th><th>Correct</th><th></th></tr></thead><tbody>${order.map(k=>`<tr><td><b>${lab(k)}</b></td><td>${by[k][0]} / ${by[k][1]}</td><td>${by[k][0]<by[k][1]?`<a href="${link(k)}">Practice</a>`:"✓"}</td></tr>`).join("")}</tbody></table></div>
  ${weak.length?`<div class="note">Study next: <b>${weak.slice(0,4).map(lab).join(", ")}</b>. Don't forget to practice writing too.</div>`:`<div class="note">Perfect score! Now practice writing.</div>`}
  <div class="row"><button class="btn" type="button" id="again">Take another practice exam</button></div></div>
  ${miss.length?`<div class="card"><h3>Review what you missed</h3><ul class="miss">${miss.map(x=>`<li>${esc(strip(x.it))}<br>Correct answer: <span class="ans es">${esc(itemKey(x.it))}</span></li>`).join("")}</ul></div>`:""}`;
  $("#again",box).onclick=again;window.scrollTo(0,0);
}

/* ================= units ================= */
const SEC1=[
  {id:"a",name:"Información personal",desc:"Ser, tener and llamarse in complete sentences.",gen:genA,vos:1,intro:`<div class="rule"><strong>Ser · Tener · Llamarse</strong><p>Ser → origin and identity. Tener → age and possession. Llamarse → name (include me / te / se / nos / se).</p><p class="sub">Ser: soy, eres, es, somos, son · Tener: tengo, tienes, tiene, tenemos, tienen · Llamarse: me llamo, te llamas, se llama, nos llamamos, se llaman</p></div>`},
  {id:"b",name:"Verbos regulares",desc:"Conjugate -ar, -er and -ir verbs in the present.",gen:genB,vos:1,intro:`<div class="rule"><strong>Drop -ar / -er / -ir, keep the stem, add the ending.</strong><p class="sub">-ar: o, as, a, amos, an · -er: o, es, e, emos, en · -ir: o, es, e, imos, en</p></div>`},
  {id:"c",name:"Los usos de tener",desc:"Age, possession, feelings and tener que + infinitive.",gen:genC,intro:`<div class="rule"><strong>4 uses of tener</strong><p>Age (tiene 14 años) · Possession (tiene un libro) · Feelings (tiene hambre) · Obligation (tiene que + infinitive)</p><p class="sub">${TQ_RULE}</p></div>`},
  {id:"d",name:"Preguntas y respuestas",desc:"Answer questions, report what someone says, ask questions.",gen:genD,intro:`<div class="rule"><strong>tú → yo → ella</strong><p>Question to a friend uses <b>tú</b> (¿Lees?). Your answer uses <b>yo</b> (Leo). Reporting about someone uses <b>él/ella</b> (Ana lee).</p></div>`},
  {id:"e",name:"Comprensión de lectura",desc:"Read a short profile and answer questions.",page:pLectura},
  {id:"f",name:"Expresión escrita",desc:"Write 6–8 sentences about another person.",page:pEscritura},
  {id:"g",name:"Escuchar",desc:"Listening practice: hear it, understand it, type it.",gen:genG,intro:`<div class="note">Use headphones or low volume. Press <b>Audio: normal</b> at the top to slow it down.</div>`}
];
const examItems1=()=>{const r=rnd(READ),qi=shuffle(r.q.map((x,k)=>k)).slice(0,3);return shuffle([].concat(rep(genA,4),rep(genB,5),rep(genC,4),rep(genD,4))).concat(qi.map(k=>genE(r,k)));};
const UNITS={
  u0:{name:"Unidad 0",long:"Unidad preliminar",decks:DECKS0,guide:pGuia0,sections:SEC0,exam:examItems0,
      lead:"Greetings and classroom language, the alphabet, classroom objects, numbers 0–100, days, months, dates, seasons, weather, and Latin American countries.",
      examTopics:"greetings and classroom language, objects and articles, numbers, the calendar, weather, countries and capitals, and a weather forecast",examNote:"Writing and listening are practiced separately in Practicar."},
  u1:{name:"Unidad 1",long:"Soy de los Estados Unidos",decks:DECKS1,guide:pGuia1,sections:SEC1,exam:examItems1,
      lead:"Subject pronouns, ser, tener and llamarse, regular -ar, -er and -ir verbs, the uses of tener, questions and answers, reading and writing.",
      examTopics:"ser, tener and llamarse, regular verbs, the uses of tener, questions and answers, and reading",examNote:"Writing is practiced separately in Practicar → Expresión escrita."}
};
route();
})();
</script>
