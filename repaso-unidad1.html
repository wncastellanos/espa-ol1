<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repaso Unidad 1 · Español I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#eef2f8; --surface:#ffffff; --sunk:#f5f7fb; --ink:#152036; --muted:#566179; --line:#d6ddea;
  --accent:#1d4ea0; --accent-ink:#ffffff; --accent-soft:#e3ebfa;
  --sun:#f3a712; --sun-soft:#fff3d6; --sun-ink:#7a4a00;
  --ok:#17744a; --ok-bg:#e2f5ea; --bad:#b3261e; --bad-bg:#fde8e6; --rev:#8a5a00; --rev-bg:#fff1d0;
  --c1:#1d4ea0; --c2:#b3261e; --c3:#17744a; --c4:#7a4a00;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#172034; --sunk:#121a2b; --ink:#e7ecf5; --muted:#9ca7bd; --line:#2a3550;
  --accent:#86a9ff; --accent-ink:#0e1320; --accent-soft:#1e2b4a;
  --sun:#f6b93b; --sun-soft:#3a2c0e; --sun-ink:#ffd88a;
  --ok:#62d29b; --ok-bg:#12301f; --bad:#ff8d84; --bad-bg:#3b1815; --rev:#ffcf70; --rev-bg:#382a0c;
  --c1:#86a9ff; --c2:#ff8d84; --c3:#62d29b; --c4:#ffcf70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#172034; --sunk:#121a2b; --ink:#e7ecf5; --muted:#9ca7bd; --line:#2a3550;
  --accent:#86a9ff; --accent-ink:#0e1320; --accent-soft:#1e2b4a;
  --sun:#f6b93b; --sun-soft:#3a2c0e; --sun-ink:#ffd88a;
  --ok:#62d29b; --ok-bg:#12301f; --bad:#ff8d84; --bad-bg:#3b1815; --rev:#ffcf70; --rev-bg:#382a0c;
  --c1:#86a9ff; --c2:#ff8d84; --c3:#62d29b; --c4:#ffcf70; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.gut{padding-left:16px;padding-right:16px}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:4px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.brand-k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand-t{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.pill{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
nav.tabs{max-width:900px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:700;padding:8px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-top:22px;padding-bottom:80px}
.page{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:clamp(24px,4vw,32px)}
h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
p{margin:0}
.lead{font-size:18px;color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.note{background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;padding:12px 16px}
.rule{background:var(--accent-soft);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.rule strong{color:var(--accent)}
.warn{background:var(--bad-bg);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.warn strong{color:var(--bad)}
.es{font-style:italic}
.sub{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
ul.clean,ol.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.btn{font:inherit;font-weight:700;text-decoration:none;display:inline-block;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus,textarea:focus,select:focus,a:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs a,.chip{font:inherit;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.subtabs a.on,.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:border-color .15s}
.big:hover{border-color:var(--accent)}
.big .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.big p{color:var(--muted);font-size:15px}
.big .pts{font-size:13px;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:middle}
th{background:var(--sunk);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
td.subj{font-weight:700;white-space:nowrap}
tr.extra td{color:var(--muted)}
.end{background:var(--sun-soft);color:var(--sun-ink);font-weight:700;border-radius:4px;padding:0 2px}
.say{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;padding:0}
.say svg{width:17px;height:17px}
.no-tts .say,.no-tts .playbig{display:none}
.cell{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.voc{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:10px;padding:8px 12px;min-width:0}
.voc .w{font-weight:700}
.voc .en{font-size:14px;color:var(--muted)}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.blk{border-radius:10px;padding:8px 14px;border:2px solid;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.blk small{font-weight:400;font-size:12px;opacity:.85}
.blk.b1{border-color:var(--c1);color:var(--c1)}
.blk.b2{border-color:var(--c2);color:var(--c2);background:var(--bad-bg)}
.blk.b3{border-color:var(--c4);color:var(--c4)}
.blk.b4{border-color:var(--c3);color:var(--c3)}
.plus{color:var(--muted);font-weight:700}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.usos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.steps4{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.steps4 li{counter-increment:s;background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.steps4 li::before{content:"Paso " counter(s);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.machine{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.machine label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
select.in{font:inherit;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:8px;padding:6px 8px}
.mout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mout div{border:1px dashed var(--line);border-radius:10px;padding:10px}
.mout .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mout .v{font-family:var(--display);font-weight:600;font-size:20px}
.mout .final{border-style:solid;border-color:var(--sun);background:var(--sun-soft)}
.mout .final .v{color:var(--sun-ink);font-size:24px}

/* flashcards */
.fc{perspective:1200px;cursor:pointer;outline:none;height:260px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.face .tag{position:absolute;top:12px;left:16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.face .txt{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1.15}
.face .txt.long{font-size:clamp(20px,3.4vw,26px);font-weight:600}
.fc:focus-visible .face{outline:3px solid var(--sun)}
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.fc-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.no{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn.yes{border-color:var(--ok);background:var(--ok);color:var(--surface)}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{font:inherit;text-align:left;background:var(--sunk);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:50px}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.mt.nope{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* practice items */
.rstats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rstats b{color:var(--ink);font-variant-numeric:tabular-nums}
.ritem{display:flex;flex-direction:column;gap:12px}
.ilabel{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.iq{font-size:20px;line-height:2.1}
.iq .paren{font-size:16px;color:var(--muted)}
.iq .small{font-size:16px;line-height:1.5}
.iq p{line-height:1.5}
input.blank{font:inherit;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:8px;padding:2px 8px;max-width:100%;min-width:6ch}
input.blank.wide{width:100%;display:block;margin-top:6px;font-size:18px;padding:6px 10px}
input.blank.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
input.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
input.blank.rev{border-color:var(--rev);background:var(--rev-bg);color:var(--rev)}
.opts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.opt{font:inherit;background:var(--sunk);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.opt[disabled]{cursor:default}
.line{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.line .ph{color:var(--muted);font-size:15px;padding-left:4px}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.tile{font:inherit;font-size:18px;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-bottom-width:4px;border-radius:10px;padding:4px 12px;cursor:pointer}
.line .tile{background:var(--accent-soft)}
.fb{font-size:16px}
.fb.good{color:var(--ok);font-weight:700}
.fb.try{color:var(--bad)}
.fb ul{margin:4px 0 0;padding-left:1.2em;font-weight:400;color:var(--ink)}
.fb .acc{color:var(--rev);font-weight:400}
.iexp{background:var(--sunk);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.exrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.playbig{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);padding:8px 18px;cursor:pointer;line-height:1.3}
.playbig svg{width:20px;height:20px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.back{align-self:flex-start}
.tog{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent)}

/* reading */
.passage{background:var(--sunk);border-radius:12px;padding:16px 18px;font-size:18px;line-height:1.8}
.passage .s{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .2s}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);outline:2px solid var(--accent)}
.passage .s.ev{background:var(--sun-soft);color:var(--sun-ink);box-shadow:inset 0 -2px 0 var(--sun)}
.qcard{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.qcard:first-child{border-top:0;padding-top:0}
.qcard .iq{font-size:17px;line-height:1.5;font-weight:700}

/* writing */
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;background:var(--sunk);border-radius:10px;padding:12px 16px}
.facts dt{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;align-self:center}
.facts dd{margin:0;font-weight:700}
textarea{font:inherit;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:8px;padding:10px;width:100%;min-height:170px;resize:vertical;line-height:1.6}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px}
.checks li{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.checks .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.checks li.yes{color:var(--ok)}
.checks li.yes .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.model{background:var(--ok-bg);color:var(--ink);border-radius:10px;padding:12px 16px}

/* exam */
.ebar{display:flex;align-items:center;gap:12px}
.ebar .prog{flex:1}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--accent)}
.miss{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.miss li{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:15px}
.miss .ans{color:var(--ok);font-weight:700}
kbd{font-family:inherit;font-size:14px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--sunk)}
@media (max-width:560px){.card{padding:16px}body{font-size:16px}.iq{font-size:18px}.match{gap:6px}.mt{font-size:15px;padding:8px}}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}.mt.nope{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in gut">
    <div class="brand"><span class="brand-k">Español I</span><span class="brand-t">Repaso · Unidad 1</span></div>
    <button id="speed" class="pill" type="button" aria-label="Velocidad del audio">Audio: normal</button>
  </div>
  <nav class="tabs gut" id="tabs" aria-label="Secciones">
    <a href="#inicio" data-r="inicio">Inicio</a>
    <a href="#repasar" data-r="repasar">Repasar</a>
    <a href="#practicar" data-r="practicar">Practicar</a>
    <a href="#examen" data-r="examen">Examen de práctica</a>
  </nav>
</header>
<main class="gut" id="main"></main>

<script>
(function(){
"use strict";
/* ================= utilities ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[].slice.call((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const stripAcc=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"");
const norm=s=>String(s||"").toLowerCase().replace(/[¿?¡!.,;:"“”«»'’()]/g," ").replace(/\s+/g," ").trim();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
const plain=h=>String(h).replace(/\{_+\}/g,"____").replace(/<br>|<\/p>/g," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
function pickW(pairs){let t=0;pairs.forEach(p=>t+=p[0]);let r=Math.random()*t;for(const p of pairs){if((r-=p[0])<0)return p[1];}return pairs[pairs.length-1][1];}

/* ================= audio ================= */
const SET={vos:false,rate:0.9};
const hasTTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
if(!hasTTS)document.documentElement.classList.add("no-tts");
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];voice=vs.find(x=>/^es[-_](MX|US)/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang))||null;}catch(e){}}
if(hasTTS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function speak(t,onend){
  if(!hasTTS){if(onend)onend();return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-MX";u.rate=SET.rate;if(voice)u.voice=voice;if(onend)u.onend=onend;speechSynthesis.speak(u);}catch(e){}
}
function hush(){if(hasTTS){try{speechSynthesis.cancel();}catch(e){}}}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const say=t=>`<button class="say" type="button" data-say="${esc(t)}" aria-label="Escuchar: ${esc(t)}">${SPK}</button>`;
const playBig=(t,label)=>`<button class="playbig" type="button" data-say="${esc(t)}">${SPK}${label||"Escuchar"}</button>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.stopPropagation();speak(b.dataset.say);}},true);
$("#speed").addEventListener("click",function(){SET.rate=SET.rate>0.8?0.65:0.9;this.textContent="Audio: "+(SET.rate>0.8?"normal":"lento");});

/* ================= grammar data ================= */
const PRONAME=["yo","tú","él / ella / usted","nosotros / nosotras","vosotros / vosotras","ellos / ellas / ustedes"];
const ORDER=[0,1,2,3,5];
const FORMS={

const ENDS={ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]};
function conj(inf,i){if(FORMS[inf])return FORMS[inf][i];return inf.slice(0,-2)+ENDS[inf.slice(-2)][i];}
const VERBS=[["hablar","to speak","español en clase"],["practicar","to practice","español"],["estudiar","to study","en casa"],["bailar","to dance","en la fiesta"],["cantar","to sing","en la iglesia"],["escuchar","to listen to","música"],["trabajar","to work","mucho"],["comer","to eat","en la cafetería"],["leer","to read","libros"],["beber","to drink","agua"],["correr","to run","en el parque"],["comprender","to understand","la lección"],["vivir","to live","en los Estados Unidos"],["escribir","to write","mensajes"],["abrir","to open","la puerta"]];
const SP=[["Yo",0,"x"],["Tú",1,"x"],["Él",2,"m"],["Ella",2,"f"],["Usted",2,"x"],["Mi hermano",2,"m"],["Mi amiga",2,"f"],["La profesora",2,"f"],["Mi padre",2,"m"],
  ["Nosotros",3,"m"],["Nosotras",3,"f"],["Mi amiga y yo",3,"f"],["Mi primo y yo",3,"m"],["Mi hermana y yo",3,"f"],
  ["Ellos",5,"m"],["Ellas",5,"f"],["Ustedes",5,"x"],["Sara y Julia",5,"f"],["Mis amigos",5,"m"],["Mis hermanas",5,"f"]];
const VOS=[["Vosotros",4,"m"],["Vosotras",4,"f"]];
const isPron=t=>/^(yo|tú|él|ella|usted|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes)$/i.test(t);

function pickSubj(onlyPron){
  let pool=SP.filter(s=>!onlyPron||isPron(s[0]));

}
const whoTxt=s=>isPron(s[0])?`<b>${s[0]}</b>`:`<b>${s[0]}</b> = ${pronOf(s)}`;
const USE={ser:"<b>Ser</b> → where someone is from and who they are.",tener:"<b>Tener</b> → age, possession, feelings, and <i>tener que</i>.",llamarse:"<b>Llamarse</b> → name. Always include the pronoun: me, te, se, nos, se."};

  const i=s[1],f=conj(inf,i);
  if(FORMS[inf]){const list=ORDER.map(k=>FORMS[inf][k]).join(", ");
    return `${whoTxt(s)}. ${inf.toUpperCase()}: ${list}${i===4?" (vosotros: "+FORMS[inf][4]+")":""} → <b>${f}</b>.<br>${USE[inf]}`;}
  const e=inf.slice(-2),st=inf.slice(0,-2);
  return `${whoTxt(s)}. <i>${inf}</i> is an <b>-${e}</b> verb: ${st}- + <span class="end">-${ENDS[e][i]}</span> = <b>${f}</b>`;
}
function diagConj(inf,s){
  return function(n,na){
    const i=s[1];
    if(na===stripAcc(inf))return `You wrote the infinitive (the dictionary form). Conjugate it for ${whoTxt(s)}.`;
    if(inf==="llamarse"){const p=FORMS.llamarse[i].split(" ");if(na===stripAcc(p[1]))return `Almost! Llamarse needs its pronoun in front: <b>${p[0]}</b> ${p[1]}.`;}
    for(let k=0;k<6;k++){if(k!==i&&stripAcc(norm(conj(inf,k)))===na)return `<b>${conj(inf,k)}</b> is the <b>${PRONAME[k]}</b> form. Who is the subject here?`;}
    if(inf==="tener"&&FORMS.ser.some(x=>stripAcc(x)===na))return "That's a form of <b>ser</b>. Age, possession and feelings use <b>tener</b>.";
    if(inf==="ser"&&FORMS.tener.some(x=>stripAcc(x)===na))return "That's a form of <b>tener</b>. Where someone is from and who they are use <b>ser</b>.";
    if(!FORMS[inf]){const e=inf.slice(-2),st=inf.slice(0,-2);
      for(const c of ["ar","er","ir"])if(c!==e&&stripAcc(st+ENDS[c][i])===na)return `Careful: <i>${inf}</i> is an <b>-${e}</b> verb, not an -${c} verb. Use the -${e} endings.`;

    return "";

}
const TQ_RULE='Formula: <b>pronoun + TENER + que + infinitive</b>. Only <b>tener</b> changes. The verb after <i>que</i> stays in the infinitive (it ends in <b>-r</b>).';

const AGES=["trece","catorce","quince","dieciséis","diecisiete"];

const NAMES={m:["Hugo","Luis","Carlos","Pablo","Diego","Andrés"],f:["Lucía","Paula","Marisol","Sofía","Elena","Camila","Valeria"]};

/* ================= item renderer ================= */
/* kinds: text (blanks), mc, tiles, open. done(score) score: 1 first try, .5 second, 0 missed */
function renderItem(box,it,maxTries,done){
  let tries=0,over=false;

    if(h){ex.innerHTML=h;ex.hidden=false;}

  const listMsgs=m=>m.length?`<ul>${uniq(m).map(x=>"<li>"+x+"</li>").join("")}</ul>`:"";

    let b=0;
    q.innerHTML=it.html.replace(/\{(_+)\}/g,(m,t)=>{const ans=it.blanks[b];const w=Math.max.apply(null,ans.map(a=>a.length))+3;const wide=t.length>1;
      return `<input class="blank${wide?" wide":""}" data-b="${b++}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="respuesta"${wide?"":` style="width:${Math.max(7,w)}ch"`}>`;});
    ctl.innerHTML=`<button class="btn" type="button">Revisar</button>`;
    const inputs=$$("input.blank",q),btn=$("button",ctl);

      const d=it.diag?(Array.isArray(it.diag)?it.diag[bi]:it.diag):null;
      return {ok:false,msg:d?d(n,stripAcc(cands[1])):""};
    }

      if(tries>=maxTries){left.forEach(inp=>{inp.value=it.blanks[+inp.dataset.b][0];inp.classList.remove("bad");inp.classList.add("rev");});inputs.forEach(i=>i.readOnly=true);
        fb.className="fb try";fb.innerHTML="Not quite. The correct answer is in yellow."+listMsgs(msgs);btn.disabled=true;finish(0);return;}
      fb.className="fb try";fb.innerHTML="Todavía no. Try again."+(msgs.length?listMsgs(msgs):(it.hint?listMsgs(["Pista: "+it.hint]):""));

    q.innerHTML=it.html;
    ctl.innerHTML=`<div class="opts">${it.options.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
    const btns=$$(".opt",ctl);const lim=Math.min(maxTries,it.options.length-1);

    btns.forEach(b=>b.onclick=()=>{
      if(over)return;const i=+b.dataset.i;tries++;
      if(i===it.correct){b.classList.add("ok");fb.className="fb good";fb.textContent=tries===1?"¡Correcto!":"¡Ahora sí!";lock();finish(tries===1?1:0.5);}
      else{b.classList.add("bad");b.disabled=true;const m=it.why&&it.why[i]?it.why[i]:"";
        if(tries>=lim){btns[it.correct].classList.add("ok");fb.className="fb try";fb.innerHTML="Not quite. "+m;lock();finish(0);}

      if(tries>=maxTries){fb.className="fb try";fb.innerHTML=`Not quite. Correct: <b class="es">${esc(it.answers[0].join(" "))}</b>`+listMsgs([d]);$$(".tile,.btn",ctl).forEach(x=>x.disabled=true);finish(0);return;}
      fb.className="fb try";fb.innerHTML="Todavía no."+listMsgs([d||("Pista: "+(it.hint||"check the verb form and the word order."))]);

  else if(it.kind==="open"){

      inp.classList.add("bad");fb.className="fb try";fb.innerHTML="Todavía no. "+m;
    }
    inp.addEventListener("input",()=>inp.classList.remove("bad"));
    btn.onclick=check;
    setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},40);
  }
  if(it.onShow)setTimeout(it.onShow,250);
}
function mixMC(opts,c){const o=shuffle(opts.map((t,i)=>[t,i===c]));return {options:o.map(a=>a[0]),correct:o.findIndex(a=>a[1])};}
function mcMake(right,wrongs){
  const all=shuffle([[right,"",true]].concat(wrongs.map(w=>[w[0],w[1]||"",false])));
  return {options:all.map(a=>a[0]),correct:all.findIndex(a=>a[2]),why:all.map(a=>a[1])};
}

/* ================= generators ================= */
function genA(){

  const s=pickSubj(),i=s[1],plural=i>=3;let comp;
  if(t==="ser")comp=Math.random()<.7?"de "+rnd(PLACES):(plural?"estudiantes":"estudiante");
  else if(t==="tener")comp=Math.random()<.55?rnd(AGES)+" años":rnd(THINGS_EN.slice(0,5))[0];
  else{const g=s[2]==="x"?"f":s[2];comp=plural?rnd(NAMES2[g]):rnd(NAMES[g]);}
  let html,audio;
  if(t==="llamarse"&&i===1&&Math.random()<.5){html=`¿Cómo {_} tú? <span class="paren">(llamarse)</span>`;audio="¿Cómo te llamas tú?";}
  else{html=`${s[0]} {_} ${comp}. <span class="paren">(${t})</span>`;audio=`${s[0]} ${conj(t,i)} ${comp}.`;}
  return {kind:"text",label:"Información personal"+(i===4?" · Extra: vosotros":""),html,blanks:[[conj(t,i)]],diag:diagConj(t,s),explain:explainConj(t,s),audio,sec:"A"};
}
function genB(){
  const v=rnd(VERBS),ctx=Math.random()<.55,s=pickSubj(!ctx),i=s[1],f=conj(v[0],i);
  const html=ctx?`${s[0]} {_} ${v[2]}. <span class="paren">(${v[0]})</span>`:`<b>${s[0].toLowerCase()}</b> / ${v[0]} <span class="paren">(${v[1]})</span> → {_}`;
  return {kind:"text",label:"Verbos regulares"+(i===4?" · Extra: vosotros":""),html,blanks:[[f]],key:ctx?null:f,diag:diagConj(v[0],s),explain:explainConj(v[0],s),audio:`${s[0]} ${f} ${v[2]}.`,sec:"B"};

const CSUBJ=[["Yo","I",0,"x"],["Tú","You",1,"x"],["Mi hermana","My sister",2,"f"],["Mi amigo","My friend",2,"m"],["Elena","Elena",2,"f"],["Nosotros","We",3,"m"],["Mis amigos","My friends",5,"m"],["Ellas","They",5,"f"]];
function tenerSentence(use,c,neg){
  const i=c[2],tf=FORMS.tener[i],be=["am","are","is","are","are","are"][i],have=i===2?"has":"have",doo=i===2?"does":"do";
  if(use===0){const a=rnd(AGES_EN);return {es:[c[0],tf,a[0],"años"],en:`${c[1]} ${be} ${a[1]} years old.`};}
  if(use===1){const t=rnd(THINGS_EN);return {es:[c[0],tf].concat(t[0].split(" ")),en:`${c[1]} ${have} ${t[1]}.`};}
  if(use===2){const x=rnd(EXPR);return {es:[c[0],tf,x[0]],en:`${c[1]} ${be} ${x[1]}.`};}
  const v=rnd(VERBS),ve=v[1].replace(/^to /,"");
  if(neg)return {es:[c[0],"no",tf,"que",v[0],"hoy"],en:`${c[1]} ${doo} not have to ${ve} today.`,v};
  return {es:[c[0],tf,"que",v[0]],en:`${c[1]} ${have} to ${ve}.`,v};
}
const sentence=toks=>cap(toks.join(" "))+".";

      diag:[diagConj("tener",s),(n,na)=>{for(let k=0;k<6;k++)if(stripAcc(conj(v[0],k))===na)return "Don't conjugate the second verb! "+TQ_RULE;return "After <i>que</i>, use the infinitive: the form that ends in -ar, -er or -ir.";}],
      explain:`${whoTxt(s)} → <b>${tf}</b>. ${TQ_RULE}<br><i>Que</i> means “to” here (have <b>to</b>). That's the only time it means “to”!`,audio:`${s[0]} ${tf} que ${v[0]} ${v[2]}.`};
  }

    const m=mcMake(`${s[0]} ${tf} que ${v[0]}.`,[[`${s[0]} ${tf} que ${conj(v[0],i)}.`,"The verb after que must stay in the infinitive (-r)."],[`${s[0]} tener que ${v[0]}.`,"Tener must be conjugated for the subject."],[`${s[0]} ${tf} ${v[0]}.`,"You need <i>que</i> between tener and the infinitive."]]);

function genD(){
  const kind=pickW([[3,"answer"],[2,"report"],[3,"ask"],[2,"open"]]);const lab="Preguntas y respuestas";
  if(kind==="answer"){
    let q,right,wrongs;
    if(Math.random()<.45){const x=rnd(QA);q=x[0];right=x[1];wrongs=x[2];}
    else{const v=rnd(VERBS.filter(v=>v[0]!=="abrir"));q=`¿${cap(conj(v[0],1))} ${v[2]}?`;right=`Sí, ${conj(v[0],0)} ${v[2]}.`;
      wrongs=[[`Sí, ${conj(v[0],1)} ${v[2]}.`,`${conj(v[0],1)} is the tú form. Answer about yourself with yo.`],[`Sí, ${conj(v[0],2)} ${v[2]}.`,`${conj(v[0],2)} is the él/ella form.`]];}
    return Object.assign({kind:"mc",label:lab+" · Contesta",html:`Your friend asks you: <span class="es">${esc(q)}</span> ${say(q)}<br>What's the best answer?`,sec:"D",explain:"A question to <b>tú</b> → answer with <b>yo</b>.",audio:right},mcMake(right,wrongs));
  }
  if(kind==="report"){
    const N=rnd(["Ana","Leo","Marta","Camila","Diego"]),v=rnd(VERBS.filter(v=>!["trabajar","abrir"].includes(v[0])));
    const where=/^en /.test(v[2]);const q=`¿${where?"Dónde":"Qué"} ${conj(v[0],2)} ${N}?`;
    const right=`${N} ${conj(v[0],2)} ${v[2]}.`;
    return Object.assign({kind:"mc",label:lab+" · Reporta",html:`${N} dice: <span class="es">«Yo ${conj(v[0],0)} ${v[2]}».</span><br><span class="es">${q}</span>`,sec:"D",
      explain:`When you report about another person, use the <b>él / ella</b> form: ${conj(v[0],0)} → <b>${conj(v[0],2)}</b>.`,audio:right},
      mcMake(right,[[`${N} ${conj(v[0],0)} ${v[2]}.`,`${conj(v[0],0)} is the yo form. ${N} is él/ella.`],[`${N} ${v[0]} ${v[2]}.`,"That's the infinitive. Conjugate it."]]));
  }
  if(kind==="ask"){
    const x=rnd(QT);const ans=x[1].join(" ");
    return {kind:"tiles",label:lab+" · Haz la pregunta",html:`<p>Your friend answered: <span class="es">«${esc(x[0])}»</span></p><p>Build the question you asked her (use <b>tú</b>).</p>`,tiles:x[1].concat(x[2]),answers:[x[1]],sec:"D",
      diag:w=>w.some(t=>/^(¿?)(tengo|leo|escribo|vivo|soy|llamo)$/.test(t))?"That's the yo form. A question to a friend uses the <b>tú</b> form.":(w.some(t=>/^(tiene|lee|escribe|vive|es|se)$/.test(t))?"That's the él/ella form. Ask your friend with <b>tú</b>.":""),
      explain:"Answer with <b>yo</b> → the question uses <b>tú</b>.",audio:ans};
  }
  const o=rnd(OPEN);
  return {kind:"open",label:lab+" · Sobre ti",html:`<p>Answer about yourself in a complete sentence:</p><p><span class="es">${o[0]}</span> ${say(o[0])} <span class="sub">${o[1]}</span></p>`,test:o[2],model:o[3],hint:o[4],sec:"D",explain:"Example answer:",audio:o[3]};
}
function genG(){
  const kind=pickW([[4,"quien"],[3,"dict"],[3,"mean"]]);const lab="Escuchar";
  if(kind==="quien"){
    const idx=SET.vos?[0,1,2,3,4,5]:ORDER;const pool=VERBS.map(v=>v[0]).concat(["ser","tener"]);const inf=rnd(pool),i=rnd(idx),f=conj(inf,i);
    return {kind:"mc",label:lab+" · ¿Quién?",html:`<p>${playBig(f)}</p><p class="small">Listen to the verb. Who is doing the action?</p>`,options:idx.map(k=>PRONAME[k]),correct:idx.indexOf(i),sec:"G",
      explain:`<b>${f}</b> (${inf}) → ${PRONAME[i]}`,audio:f,onShow:()=>speak(f)};
  }
  if(kind==="dict"){
    const s=pickSubj(),v=rnd(VERBS),sent=`${s[0]} ${conj(v[0],s[1])} ${v[2]}.`;
    return {kind:"text",label:lab+" · Dictado",html:`<p>${playBig(sent)}</p><p class="small">Listen and type the sentence you hear. Play it as many times as you need.</p>{__}`,blanks:[[sent]],sec:"G",
      diag:()=>"Listen again. Check the subject and the verb ending.",explain:"",audio:sent,onShow:()=>speak(sent)};
  }
  const pool=EXPR.map(x=>[`Tengo ${x[0]}.`,`I'm ${x[1]}.`]).concat([["¿Cómo te llamas?","What's your name?"],["¿De dónde eres?","Where are you from?"],["¿Cuántos años tienes?","How old are you?"],["¿Dónde vives?","Where do you live?"],["Tengo que estudiar.","I have to study."],["¿Qué escribes en clase?","What do you write in class?"]]);
  const x=rnd(pool);const m=mcMake(x[1],shuffle(pool.filter(p=>p!==x)).slice(0,2).map(p=>[p[1],""]));
  return Object.assign({kind:"mc",label:lab+" · ¿Qué significa?",html:`<p>${playBig(x[0])}</p><p class="small">What does it mean?</p>`,sec:"G",explain:`<span class="es">${esc(x[0])}</span> = ${esc(x[1])}`,audio:x[0],onShow:()=>speak(x[0])},m);
}

  <article class="card" id="g-pron"><h3>1 · Los pronombres</h3>
  <div class="tbl-wrap"><table><thead><tr><th>Español</th><th>English</th><th>Notes</th></tr></thead><tbody>
  ${[["yo","I",""],["tú","you","a friend, family member, classmate"],["él","he",""],["ella","she",""],["usted","you (formal)","a teacher or adult. Uses the <b>él/ella</b> verb form."],["nosotros / nosotras","we","<b>nosotras</b> = a group of all girls"],["ellos / ellas","they","<b>ellas</b> = a group of all girls"],["ustedes","you all","uses the <b>ellos/ellas</b> verb form"],["vosotros / vosotras","you all (Spain)","only for extra credit on the exam"]].map(r=>`<tr><td><span class="cell"><b>${r[0]}</b>${say(r[0])}</span></td><td>${r[1]}</td><td class="sub">${r[2]}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="rule"><strong>Names and groups → pick the pronoun first</strong><p><span class="es">Mi amiga y yo</span> = nosotras · <span class="es">Sara y Julia</span> = ellas · <span class="es">Mi hermano</span> = él · <span class="es">Tú y Ana</span> = ustedes · <span class="es">La profesora</span> = ella</p></div></article>

  <article class="card" id="g-stl"><h3>2 · Ser, tener y llamarse</h3>
  ${stlTable()}
  <div class="usos"><div class="rule"><strong>SER</strong><span>origin and identity</span><span class="es">Soy de Texas. Es profesora.</span></div>
  <div class="rule"><strong>TENER</strong><span>age, possession, feelings, have to</span><span class="es">Tengo catorce años.</span></div>
  <div class="rule"><strong>LLAMARSE</strong><span>name. Always two words!</span><span class="es">Me llamo Lucía. Se llama Paula.</span></div></div>
  <div class="warn"><strong>Common mistake</strong><p>✗ <span class="es">Soy catorce años.</span> → ✓ <span class="es">Tengo catorce años.</span> In Spanish you <b>have</b> years.</p><p>✗ <span class="es">Mi amiga llama Paula.</span> → ✓ <span class="es">Mi amiga <b>se</b> llama Paula.</span> Don't forget the pronoun.</p></div></article>

  <article class="card" id="g-verb"><h3>3 · Verbos regulares: -ar, -er, -ir</h3>
  <p>The <b>infinitive</b> is the basic form of a verb (“to ___”). In Spanish it always ends in <b>-ar</b>, <b>-er</b> or <b>-ir</b>. To <b>conjugate</b> means to change the ending so it matches who is doing the action.</p>
  <ol class="steps4"><li><b>Find the subject.</b> <span class="es">nosotros</span></li><li><b>Find the ending.</b> <span class="es">hablar → -ar</span></li><li><b>Drop it. Keep the stem.</b> <span class="es">habl-</span></li><li><b>Add the new ending.</b> <span class="es">habl + amos = hablamos</span></li></ol>
  ${endsTable()}
  <p class="sub">-er and -ir have the same endings except for <b>nosotros</b> (-emos / -imos) and vosotros.</p>
  <div class="card" style="background:var(--sunk)"><h3>La máquina de verbos</h3><p class="sub">Pick a verb and a subject and watch the 4 steps.</p>
  <div class="machine"><label for="mv">Verbo<select id="mv" class="in">${VERBS.map(v=>`<option value="${v[0]}">${v[0]} (${v[1]})</option>`).join("")}</select></label>
  <label for="ms">Sujeto<select id="ms" class="in">${[0,1,2,3,5,4].map(i=>`<option value="${i}">${PRONAME[i]}</option>`).join("")}</select></label></div>
  <div class="mout" id="mout"></div></div>
  <div class="vocab">${VERBS.map(v=>`<div class="voc"><div><div class="w">${v[0]}</div><div class="en">${v[1]}</div></div>${say(v[0])}</div>`).join("")}</div></article>

  <article class="card" id="g-usos"><h3>4 · Los 4 usos de tener</h3>
  <div class="usos">
   <div class="rule"><strong>1 · Edad (age)</strong><span>tener + number + años</span><span class="es">Él tiene catorce años. ${say("Él tiene catorce años.")}</span></div>
   <div class="rule"><strong>2 · Posesión</strong><span>tener + a thing</span><span class="es">Nosotros tenemos un cuaderno. ${say("Nosotros tenemos un cuaderno.")}</span></div>
   <div class="rule"><strong>3 · Expresiones</strong><span>tener + hambre, sed, frío…</span><span class="es">Yo tengo hambre. ${say("Yo tengo hambre.")}</span></div>
   <div class="rule"><strong>4 · Obligación</strong><span>tener + que + infinitive</span><span class="es">Tengo que estudiar. ${say("Tengo que estudiar.")}</span></div></div>
  <div class="vocab">${EXPR.map(x=>`<div class="voc"><div><div class="w">tener ${x[0]}</div><div class="en">to be ${x[1]}</div></div>${say("tener "+x[0])}</div>`).join("")}</div></article>

  <article class="card" id="g-tq"><h3>5 · Tener que + infinitivo (to have to)</h3>
  <div class="formula"><span class="blk b1">Pronombre<small>yo, tú, él…</small></span><span class="plus">+</span><span class="blk b2">TENER<small>conjugate it!</small></span><span class="plus">+</span><span class="blk b3">que<small>= “to”</small></span><span class="plus">+</span><span class="blk b4">infinitivo<small>ends in -r</small></span></div>
  <ul class="clean" style="font-size:18px">
   <li><span class="es">Yo <b>tengo</b> que estudiar.</span> ${say("Yo tengo que estudiar.")}</li>
   <li><span class="es">Él <b>tiene</b> que practicar.</span> ${say("Él tiene que practicar.")}</li>
   <li><span class="es">Nosotros <b>tenemos</b> que leer.</span> ${say("Nosotros tenemos que leer.")}</li></ul>
  <div class="note"><b>Remember!</b><ul class="clean" style="margin-top:6px">
   <li><b>Que</b> means “to” <b>only</b> in this sentence form (have <b>to</b>).</li>
   <li><b>All infinitives end with an r:</b> estudia<b>r</b>, lee<b>r</b>, escribi<b>r</b>.</li>
   <li><b>The only thing we conjugate is TENER</b>, depending on the pronoun. The second verb never changes.</li></ul></div>
  <div class="warn"><strong>Common mistake</strong><p>✗ <span class="es">Ella tiene que escribe.</span> → ✓ <span class="es">Ella tiene que escribir.</span></p><p>Negative: put <b>no</b> before tener. <span class="es">Yo no tengo que comer ahora.</span> ${say("Yo no tengo que comer ahora.")}</p></div></article>

  <article class="card" id="g-preg"><h3>6 · Preguntas y respuestas</h3>
  <p>The verb changes with the person. A question to <b>tú</b> gets a <b>yo</b> answer. When you report about someone else, use <b>él / ella</b>.</p>
  <div class="tbl-wrap"><table><thead><tr><th>You ask (tú)</th><th>She answers (yo)</th><th>You report (ella)</th></tr></thead><tbody>
  ${[["¿Cómo te llamas?","Me llamo Ana.","Se llama Ana."],["¿De dónde eres?","Soy de Texas.","Es de Texas."],["¿Cuántos años tienes?","Tengo catorce años.","Tiene catorce años."],["¿Dónde vives?","Vivo en Houston.","Vive en Houston."],["¿Qué lees en casa?","Leo libros.","Lee libros."],["¿Qué escribes en clase?","Escribo mensajes.","Escribe mensajes."],["¿Qué tienes que hacer hoy?","Tengo que estudiar.","Tiene que estudiar."]].map(r=>`<tr>${r.map(c=>`<td><span class="cell"><span class="es">${c}</span>${say(c)}</span></td>`).join("")}</tr>`).join("")}
  </tbody></table></div>
  <p class="sub">Question words: <b>¿Cómo?</b> how · <b>¿De dónde?</b> from where · <b>¿Dónde?</b> where · <b>¿Cuántos?</b> how many · <b>¿Qué?</b> what</p></article>

  <article class="card" id="g-neg"><h3>7 · La negación</h3>
  <p>Put <b>no</b> right before the conjugated verb.</p>
  <ul class="clean"><li><span class="es">No tengo hambre.</span> I'm not hungry.</li><li><span class="es">Ella no lee libros.</span> She doesn't read books.</li><li><span class="es">No tenemos que estudiar hoy.</span> We don't have to study today.</li><li>Answering a question: <span class="es">No, no leo libros.</span> (two no's!)</li></ul></article>

  <article class="card" id="g-escr"><h3>8 · Escribir sobre otra persona</h3>
  <p>Write <b>about</b> the person with third-person forms (él / ella). Don't write as if you are her. Include all six facts.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Fact</th><th>Use</th><th>Example</th></tr></thead><tbody>
  <tr><td>Name</td><td>se llama</td><td class="es">Ella se llama Gabriela.</td></tr>
  <tr><td>Origin</td><td>es de</td><td class="es">Es de Dallas.</td></tr>
  <tr><td>Age</td><td>tiene + number + años</td><td class="es">Tiene quince años.</td></tr>
  <tr><td>Possession</td><td>tiene + thing</td><td class="es">Tiene dos cuadernos.</td></tr>
  <tr><td>Activity</td><td>regular verb, ella form</td><td class="es">Gabriela escribe mensajes.</td></tr>
  <tr><td>Obligation</td><td>tiene que + infinitive</td><td class="es">Hoy tiene que leer un libro.</td></tr></tbody></table></div>
  <p><a href="#practicar/f">Practice writing →</a></p></article>`;
  $$(".toc .chip",box).forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.go);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});});
  const mv=$("#mv",box),ms=$("#ms",box),out=$("#mout",box);
  function upd(){const v=mv.value,i=+ms.value,e=v.slice(-2),st=v.slice(0,-2);
    out.innerHTML=`<div><div class="k">1 · Sujeto</div><div class="v">${PRONAME[i]}</div></div><div><div class="k">2 · Terminación</div><div class="v">-${e}</div></div><div><div class="k">3 · Raíz</div><div class="v">${st}-</div></div><div class="final"><div class="k">4 · Nueva forma</div><div class="v">${st}<span class="end">${ENDS[e][i]}</span> ${say(conj(v,i))}</div></div>`;}
  mv.onchange=upd;ms.onchange=upd;upd();

function deckChips(cur){return `<div class="subtabs" role="group" aria-label="Elige un tema">${Object.keys(DECKS).map(k=>`<button type="button" class="chip${k===cur?" on":""}" data-deck="${k}">${DECKS[k].name}</button>`).join("")}</div>`;}
function pTarjetas(box){
  const st={deck:"pron",order:[],i:0,known:0,again:[],flip:false,en:false};
  function start(list){st.order=shuffle(list);st.i=0;st.known=0;st.again=[];st.flip=false;draw();}
  function cards(){return DECKS[st.deck].cards;}
  function draw(){
    const D=DECKS[st.deck],total=st.order.length;
    let h=deckChips(st.deck)+`<div class="card">`;
    if(st.i>=total){
      h+=`<h3>¡Terminaste!</h3><p style="font-size:20px">You knew <b>${st.known}</b> of <b>${total}</b>.</p><div class="row">${st.again.length?`<button class="btn" type="button" id="again">Review the ${st.again.length} I missed</button>`:""}<button class="btn ghost" type="button" id="restart">Start over</button></div>`;
    }else{
      const c=st.order[st.i],f=st.en?c[1]:c[0],b=st.en?c[0]:c[1];
      h+=`<div class="fc-bar"><span class="sub">Tarjeta ${st.i+1} de ${total} · Sé: ${st.known} · Repasar: ${st.again.length}</span><label class="tog"><input type="checkbox" id="enf"${st.en?" checked":""}> Show the back side first</label></div>
      <div class="prog"><i style="width:${st.i/total*100}%"></i></div>
      <div class="fc${st.flip?" flip":""}" tabindex="0" role="button" aria-label="Tarjeta. Press to flip."><div class="fc-in">
        <div class="face front"><span class="tag">${st.en?D.back:D.front}</span><div class="txt${f.length>22?" long":""}">${esc(f)}</div></div>
        <div class="face back"><span class="tag">${st.en?D.front:D.back}</span><div class="txt${b.length>22?" long":""}">${esc(b)}</div>${say(c[2])}</div></div></div>
      <div class="fc-actions"><button class="btn no" type="button" id="no">↻ Otra vez</button><button class="btn ghost" type="button" id="flip">Voltear</button><button class="btn yes" type="button" id="yes">✓ Lo sé</button></div>
      <p class="sub" style="text-align:center">Click the card or press <kbd>Space</kbd> to flip. <kbd>←</kbd> otra vez · <kbd>→</kbd> lo sé</p>`;
    }
    box.innerHTML=h+`</div>`;
    $$("[data-deck]",box).forEach(b=>b.onclick=()=>{st.deck=b.dataset.deck;start(cards());});
    if(st.i>=total){const a=$("#again",box);if(a)a.onclick=()=>start(st.again);$("#restart",box).onclick=()=>start(cards());return;}
    const fc=$(".fc",box);
    const flip=()=>{st.flip=!st.flip;fc.classList.toggle("flip",st.flip);if(st.flip&&!st.en)speak(st.order[st.i][2]);};
    fc.onclick=e=>{if(e.target.closest(".say"))return;flip();};
    $("#flip",box).onclick=flip;
    $("#yes",box).onclick=()=>{st.known++;st.i++;st.flip=false;draw();};
    $("#no",box).onclick=()=>{st.again.push(st.order[st.i]);st.i++;st.flip=false;draw();};
    $("#enf",box).onchange=e=>{st.en=e.target.checked;st.flip=false;draw();};
  }
  function key(e){
    if(e.target.matches("input,textarea,select")||st.i>=st.order.length)return;
    if(e.key===" "||e.key==="Enter"){if(e.target.closest("button:not(.fc)"))return;e.preventDefault();const b=$("#flip",box);if(b)b.click();}
    else if(e.key==="ArrowRight"){const b=$("#yes",box);if(b)b.click();}
    else if(e.key==="ArrowLeft"){const b=$("#no",box);if(b)b.click();}
  }
  document.addEventListener("keydown",key);cleanup=()=>document.removeEventListener("keydown",key);
  start(cards());
}

function pEmparejar(box){
  let deck="expr";
  function game(){
    const pick=shuffle(DECKS[deck].cards).slice(0,6).map((c,i)=>({id:i,c}));
    const L=shuffle(pick),R=shuffle(pick);let sel=null,found=0,miss=0;const t0=Date.now();
    box.innerHTML=deckChips(deck)+`<div class="card"><div class="fc-bar"><h3>Match the pairs</h3><span class="sub" id="mstat">Errores: 0</span></div>
      <p class="sub">Click a word on the left, then its match on the right.</p>
      <div class="match"><div class="col">${L.map(p=>`<button class="mt" type="button" data-side="L" data-id="${p.id}">${esc(p.c[0])}</button>`).join("")}</div>
      <div class="col">${R.map(p=>`<button class="mt" type="button" data-side="R" data-id="${p.id}">${esc(p.c[1])}</button>`).join("")}</div></div>
      <div id="mdone"></div></div>`;
    $$("[data-deck]",box).forEach(b=>b.onclick=()=>{deck=b.dataset.deck;game();});
    $$(".mt",box).forEach(b=>b.onclick=()=>{
      if(b.classList.contains("done"))return;
      if(!sel||sel.dataset.side===b.dataset.side){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return;}
      if(sel.dataset.id===b.dataset.id){[sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true;});
        speak(pick.find(p=>String(p.id)===b.dataset.id).c[2]);found++;sel=null;
        if(found===pick.length){const s=Math.round((Date.now()-t0)/1000);$("#mdone",box).innerHTML=`<div class="note" style="margin-top:10px"><b>¡Excelente!</b> All ${pick.length} pairs in ${s} seconds with ${miss} ${miss===1?"mistake":"mistakes"}. <button class="btn" type="button" id="mre" style="margin-left:8px">Play again</button></div>`;$("#mre",box).onclick=game;}}
      else{miss++;$("#mstat",box).textContent="Errores: "+miss;const a=sel;[a,b].forEach(x=>x.classList.add("nope"));setTimeout(()=>[a,b].forEach(x=>x.classList.remove("nope","sel")),450);sel=null;}
    });
  }
  game();
}

function runner(box,gen,intro){
  box.innerHTML=`${intro||""}<div class="card"><div class="rstats"><span>Correct on 1st try: <b class="s1">0</b></span><span>Questions: <b class="sn">0</b></span><span>Streak: <b class="sr">0</b></span></div><div class="ritem"></div><div><button class="btn" type="button" id="rnext" hidden>Next question →</button></div></div>`;
  const s={n:0,first:0,streak:0},ib=$(".ritem",box),nb=$("#rnext",box);
  const upd=()=>{$(".s1",box).textContent=s.first;$(".sn",box).textContent=s.n;$(".sr",box).textContent=s.streak;};
  function next(){hush();nb.hidden=true;renderItem(ib,gen(),2,r=>{s.n++;if(r===1){s.first++;s.streak++;}else s.streak=0;upd();nb.hidden=false;setTimeout(()=>nb.focus({preventScroll:true}),30);});}
  nb.onclick=next;next();
}
function vosToggle(){return `<label class="tog"><input type="checkbox" id="vos"${SET.vos?" checked":""}> Include <b>vosotros</b> (extra credit)</label>`;}
function wireVos(box){const v=$("#vos",box);if(v)v.onchange=()=>{SET.vos=v.checked;};}

    <div class="secgrid">${SECTIONS.map(s=>`<a class="big" href="#practicar/${s[0]}"><span class="k">${s[1]==="+"?"Bonus":"Práctica"}</span><h3>${s[2]}</h3><p>${s[4]}</p></a>`).join("")}</div></section>`;

  }
  main.innerHTML=`<section class="page"><a class="btn ghost back" href="#practicar">← All sections</a><div><div class="eyebrow">Practicar</div><h2>${sec[2]}</h2></div><div id="pbox" style="display:flex;flex-direction:column;gap:16px"></div></section>`;
  const box=$("#pbox");
  const intro={
    a:`<div class="rule"><strong>Ser · Tener · Llamarse</strong><p>Ser → origin and identity. Tener → age and possession. Llamarse → name (include me / te / se / nos / se).</p><p class="sub">Ser: soy, eres, es, somos, son · Tener: tengo, tienes, tiene, tenemos, tienen · Llamarse: me llamo, te llamas, se llama, nos llamamos, se llaman</p></div><div>${vosToggle()}</div>`,
    b:`<div class="rule"><strong>Drop -ar / -er / -ir, keep the stem, add the ending.</strong><p class="sub">-ar: o, as, a, amos, an · -er: o, es, e, emos, en · -ir: o, es, e, imos, en</p></div><div>${vosToggle()}</div>`,
    c:`<div class="rule"><strong>4 uses of tener</strong><p>Age (tiene 14 años) · Possession (tiene un libro) · Feelings (tiene hambre) · Obligation (tiene que + infinitive)</p><p class="sub">${TQ_RULE}</p></div>`,
    d:`<div class="rule"><strong>tú → yo → ella</strong><p>Question to a friend uses <b>tú</b> (¿Lees?). Your answer uses <b>yo</b> (Leo). Reporting about someone uses <b>él/ella</b> (Ana lee).</p></div>`,
    g:`<div class="note">Use headphones or low volume. Press <b>Audio: normal</b> at the top to slow it down.</div>`
  }[sub];
  if(sub==="e")return pLectura(box);
  if(sub==="f")return pEscritura(box);
  runner(box,{a:genA,b:genB,c:genC,d:genD,g:genG}[sub],intro);wireVos(box);

function pLectura(box){
  let cur=0;
  function draw(){
    hush();const r=READ[cur];let got=0,n=0;
    box.innerHTML=`<div class="subtabs">${READ.map((x,k)=>`<button class="chip${k===cur?" on":""}" type="button" data-r="${k}">Lectura ${k+1}: ${x.title}</button>`).join("")}</div>
    <div class="card"><div class="row"><button class="playbig" type="button" id="all">${SPK}<span>Listen to the whole text</span></button><span class="sub">Click any sentence to hear it.</span></div>
    <div class="passage" id="pass">${passageHTML(r)}</div><p class="sub">Vocabulario: ${r.vocab}</p>
    <p class="sub">Read on your own first. After each answer, the sentence that proves it lights up in yellow (that's your evidence).</p></div>
    <div class="card" id="qs">${r.q.map((x,k)=>`<div class="qcard" id="q${k}"></div>`).join("")}<div id="rsum" class="note" hidden></div></div>`;
    $$("[data-r]",box).forEach(b=>b.onclick=()=>{cur=+b.dataset.r;draw();});
    const pass=$("#pass",box);
    $$(".s",pass).forEach(s=>s.onclick=()=>{$$(".s.now",pass).forEach(x=>x.classList.remove("now"));s.classList.add("now");speak(s.textContent,()=>s.classList.remove("now"));});
    let playing=false;
    $("#all",box).onclick=function(){
      const btn=this;if(playing){playing=false;hush();$$(".s.now",pass).forEach(x=>x.classList.remove("now"));$("span",btn).textContent="Listen to the whole text";return;}
      playing=true;$("span",btn).textContent="Stop";const ss=$$(".s",pass);let k=0;
      (function step(){$$(".s.now",pass).forEach(x=>x.classList.remove("now"));if(!playing||k>=ss.length){playing=false;$("span",btn).textContent="Listen to the whole text";return;}ss[k].classList.add("now");speak(ss[k].textContent,()=>{k++;step();});})();
    };
    r.q.forEach((x,k)=>{
      renderItem($("#q"+k,box),Object.assign({kind:"mc",html:`${k+1}. ${esc(x[0])}`,explain:x[4]},mixMC(x[1],x[2])),2,sc=>{
        n++;if(sc===1)got++;x[3].forEach(e=>{const s=$(`.s[data-k="${e}"]`,pass);if(s)s.classList.add("ev");});
        if(n===r.q.length){const s=$("#rsum",box);s.hidden=false;s.innerHTML=`<b>${got} of ${r.q.length}</b> correct on the first try. ${got===r.q.length?"¡Perfecto!":"Re-read the yellow sentences for the ones you missed."} ${cur<READ.length-1?`<button class="btn" type="button" id="nextr" style="margin-left:8px">Next reading →</button>`:""}`;const nr=$("#nextr",box);if(nr)nr.onclick=()=>{cur++;draw();window.scrollTo(0,0);};}
      });
    });
  }
  draw();
}

  {name:"Camila",g:"f",origin:"Houston",age:15,ageW:"quince",pos:"tres cuadernos",posEn:"three notebooks",act:"escribir mensajes",actEn:"writes messages",actForm:"escribe",obl:"estudiar español",when:"hoy",whenEn:"today",oblEn:"study Spanish"},
  {name:"Lucas",g:"m",origin:"Chicago",age:13,ageW:"trece",pos:"una mochila",posEn:"a backpack",act:"comer en la cafetería",actEn:"eats in the cafeteria",actForm:"come",obl:"leer un libro",when:"esta noche",whenEn:"tonight",oblEn:"read a book"},
  {name:"Isabel",g:"f",origin:"Nueva Orleans",age:17,ageW:"diecisiete",pos:"dos libros",posEn:"two books",act:"hablar español en casa",actEn:"speaks Spanish at home",actForm:"habla",obl:"escribir un mensaje",when:"hoy",whenEn:"today",oblEn:"write a message"},
  {name:"Mateo",g:"m",origin:"Miami",age:16,ageW:"dieciséis",pos:"un cuaderno",posEn:"one notebook",act:"leer libros en casa",actEn:"reads books at home",actForm:"lee",obl:"practicar español",when:"esta noche",whenEn:"tonight",oblEn:"practice Spanish"}
];
function pEscritura(box){
  let cur=0;const drafts={};
  function draw(){
    const p=PEOPLE[cur],S=x=>stripAcc(norm(x)),rest=p.act.split(" ").slice(1).join(" ");
    const checks=[
      [`Se llama ${p.name}.`,new RegExp(`\\bse llama ${S(p.name)}\\b`)],
      [`Es de ${p.origin}.`,new RegExp(`\\bes de ${S(p.origin)}\\b`)],
      [`Tiene ${p.ageW} años.`,new RegExp(`\\btiene (${S(p.ageW)}|${p.age}) anos\\b`)],
      [`Tiene ${p.pos}.`,new RegExp(`\\btiene ${S(p.pos)}\\b`)],
      [`${cap(p.actForm)} ${rest}. (regular verb, ${p.g==="f"?"ella":"él"} form)`,new RegExp(`\\b${p.actForm}\\b`)],
      [`Tiene que ${p.obl}.`,new RegExp(`\\btiene que ${S(p.obl).split(" ")[0]}\\b`)]
    ];
    const model=`${p.g==="f"?"Ella":"Él"} se llama ${p.name}. Es de ${p.origin}. Tiene ${p.ageW} años. Es estudiante. Tiene ${p.pos}. ${p.name} ${p.actForm} ${rest}. ${cap(p.when)} tiene que ${p.obl}.`;
    box.innerHTML=`<div class="subtabs">${PEOPLE.map((x,k)=>`<button class="chip${k===cur?" on":""}" type="button" data-p="${k}">${x.name}</button>`).join("")}</div>
    <div class="two"><div class="card"><h3>Write about ${p.name}</h3><dl class="facts"><dt>Nombre</dt><dd>${p.name}</dd><dt>Origen</dt><dd>${p.origin}</dd><dt>Edad</dt><dd>${p.age} años</dd><dt>Posesión</dt><dd>${p.pos} <span class="sub">(${p.posEn})</span></dd><dt>Actividad</dt><dd>${p.act} <span class="sub">(${p.actEn})</span></dd><dt>Obligación</dt><dd>${p.when}: ${p.obl} <span class="sub">(${p.whenEn}: ${p.oblEn})</span></dd></dl>
      <p class="sub">Write 6–8 complete sentences ABOUT ${p.name} using ${p.g==="f"?"ella":"él"} forms. Don't write as if you are ${p.name}. You can add one or two invented details.</p></div>
    <div class="card"><h3>Checklist</h3><ul class="checks" id="chk">${checks.map((c,k)=>`<li data-c="${k}"><span class="box"></span>${esc(c[0])}</li>`).join("")}</ul><p class="sub" id="cnt"></p><div id="third" class="warn" hidden><strong>Careful!</strong><span>You used a <b>yo</b> form (me llamo, soy, tengo…). Write about ${p.g==="f"?"her":"him"}: se llama, es, tiene.</span></div></div></div>
    <div class="card"><label for="ta"><h3>Mi párrafo</h3></label><textarea id="ta" placeholder="${p.g==="f"?"Ella":"Él"} se llama ${p.name}…">${esc(drafts[cur]||"")}</textarea>
    <div class="row"><button class="btn ghost" type="button" id="lis">${"Listen to my paragraph"}</button><button class="btn" type="button" id="mod" disabled>Show a model</button><span class="sub" id="modhint">The model unlocks after you write at least 4 sentences.</span></div>
    <div id="modbox" hidden></div></div>`;
    $$("[data-p]",box).forEach(b=>b.onclick=()=>{cur=+b.dataset.p;draw();});
    const ta=$("#ta",box);
    function upd(){
      drafts[cur]=ta.value;const t=stripAcc(norm(ta.value));let ok=0;
      checks.forEach((c,k)=>{const y=c[1].test(t);if(y)ok++;const li=$(`[data-c="${k}"]`,box);li.classList.toggle("yes",y);$(".box",li).textContent=y?"✓":"";});
      const sents=ta.value.split(/[.!?]+/).filter(x=>x.trim().split(/\s+/).length>=2).length;
      $("#cnt",box).innerHTML=`<b>${ok} of 6</b> facts · <b>${sents}</b> ${sents===1?"sentence":"sentences"} (goal: 6–8)${ok===6&&sents>=6?" · <b style='color:var(--ok)'>¡Excelente! All six facts.</b>":""}`;
      $("#third",box).hidden=!/\b(me llamo|soy|tengo|vivo|escribo|como|hablo|leo)\b/.test(t);
      const m=$("#mod",box);m.disabled=sents<4;$("#modhint",box).hidden=sents>=4;
    }
    ta.addEventListener("input",upd);upd();
    $("#lis",box).onclick=()=>{if(ta.value.trim())speak(ta.value);};
    $("#mod",box).onclick=()=>{const mb=$("#modbox",box);mb.hidden=false;mb.innerHTML=`<div class="model"><b>Model:</b> <span class="es">${esc(model)}</span> ${say(model)}<p class="sub" style="margin-top:6px">Compare with yours. Did you use se llama, es de, tiene + años, tiene + a thing, a regular verb, and tiene que + infinitive?</p></div>`;};
  }
  draw();
}

/* ---------- practice exam ---------- */
function pExamen(){
  main.innerHTML=`<section class="page"><div><h2>Examen de práctica</h2><p class="lead" style="margin-top:6px">20 mixed questions from everything in Unit 1. You get <b>one try</b> for each question. At the end you'll see your score and what to study.</p></div>
  <div class="card"><p>Mixed questions on: ser, tener and llamarse · regular verbs · the uses of tener · questions and answers · reading.</p>
  <p class="sub">Writing is practiced separately in <a href="#practicar/f">Practicar → Expresión escrita</a>.</p>
  <div>${vosToggle()}</div><div><button class="btn" type="button" id="go">Start the exam</button></div></div></section>`;
  wireVos(main);
  $("#go").onclick=runExam;
}
function runExam(){
  const r=rnd(READ),qi=shuffle(r.q.map((x,k)=>k)).slice(0,3);
  const items=shuffle([].concat([0,1,2,3].map(genA),[0,1,2,3,4].map(genB),[0,1,2,3].map(genC),[0,1,2,3].map(genD))).concat(qi.map(k=>genE(r,k)));
  const res=[];let k=0;
  main.innerHTML=`<section class="page"><div class="ebar"><span class="sub" id="eno"></span><div class="prog"><i id="ep"></i></div></div><div class="card"><div class="ritem" id="eit"></div><div><button class="btn" type="button" id="enext" hidden>Next →</button></div></div></section>`;
  const nb=$("#enext");
  function show(){
    hush();nb.hidden=true;$("#eno").textContent=`Question ${k+1} of ${items.length}`;$("#ep").style.width=(k/items.length*100)+"%";
    renderItem($("#eit"),items[k],1,sc=>{res.push({it:items[k],sc});nb.hidden=false;nb.textContent=k===items.length-1?"See my results →":"Next →";setTimeout(()=>nb.focus({preventScroll:true}),30);});
    window.scrollTo(0,0);
  }
  nb.onclick=()=>{k++;if(k<items.length)show();else results(res);};
  show();
}
function itemKey(it){
  if(it.kind==="text")return it.key||it.audio||it.blanks.map(b=>b[0]).join(" … ");
  if(it.kind==="mc")return it.options[it.correct];
  if(it.kind==="tiles")return it.answers[0].join(" ");
  return it.model;
}
function results(res){
  const got=res.filter(x=>x.sc===1).length,pct=Math.round(got/res.length*100);
  const by={};res.forEach(x=>{const s=x.it.sec;by[s]=by[s]||[0,0];by[s][1]++;if(x.sc===1)by[s][0]++;});
  const names={A:"Información personal",B:"Verbos regulares",C:"Los usos de tener",D:"Preguntas y respuestas",E:"Comprensión de lectura"};
  const weak=Object.keys(by).filter(s=>by[s][0]<by[s][1]).sort((a,b)=>by[a][0]/by[a][1]-by[b][0]/by[b][1]);
  const miss=res.filter(x=>x.sc!==1);
  main.innerHTML=`<section class="page"><h2>Resultados</h2>
  <div class="card"><div class="row" style="gap:24px"><div class="score">${pct}%</div><div><p style="font-size:20px"><b>${got} of ${res.length}</b> correct</p><p class="sub">${pct>=90?"¡Excelente! You're ready.":pct>=75?"¡Muy bien! Review the ones you missed.":"Keep practicing. Focus on the sections below."}</p></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Tema</th><th>Correct</th><th></th></tr></thead><tbody>${Object.keys(by).map(s=>`<tr><td><b>${names[s]}</b></td><td>${by[s][0]} / ${by[s][1]}</td><td>${by[s][0]<by[s][1]?`<a href="#practicar/${s.toLowerCase()}">Practice</a>`:"✓"}</td></tr>`).join("")}</tbody></table></div>
  ${weak.length?`<div class="note">Study next: <b>${weak.map(s=>names[s]).join(", ")}</b>. Don't forget to practice <a href="#practicar/f">writing</a> too.</div>`:`<div class="note">Perfect score! Now practice <a href="#practicar/f">writing</a>.</div>`}
  <div class="row"><button class="btn" type="button" id="again">Take another practice exam</button></div></div>
  ${miss.length?`<div class="card"><h3>Review what you missed</h3><ul class="miss">${miss.map(x=>`<li>${esc(plain(x.it.kind==="mc"&&x.it.sec==="E"?x.it.html.replace(/^[\s\S]*<p style="font-weight:700">/,""):x.it.html))}<br>Correct answer: <span class="ans es">${esc(itemKey(x.it))}</span></li>`).join("")}</ul></div>`:""}</section>`;
  $("#again").onclick=runExam;window.scrollTo(0,0);
}

route();
})();
</script>
